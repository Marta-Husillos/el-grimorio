services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ***REMOVED_DB_PASSWORD***
      MYSQL_DATABASE: dnd_pnj
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./bankend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: dnd_pnj
      DB_USER: root
      DB_PASSWORD: ***REMOVED_DB_PASSWORD***
      PORT: 5000
      JWT_SECRET: ***REMOVED_JWT_SECRET***
      DEEPL_API_KEY: ${DEEPL_API_KEY}
      EMAIL_USER: dndpnj.noreply@gmail.com
      EMAIL_PASS: ***REMOVED_EMAIL_PASS***
      FRONTEND_URL: ${FRONTEND_URL:-http://192.168.1.10:3000}
    volumes:
      - ./bankend/public/avatars:/app/public/avatars
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
